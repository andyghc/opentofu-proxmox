# OpenTofu Apply — runs when code is merged to main
# Applies infrastructure changes to the target environment

name: OpenTofu Apply

on:
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/apply.yaml"

env:
  TF_VAR_proxmox_endpoint:  ${{ secrets.PROXMOX_ENDPOINT }}
  TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
  TF_VAR_proxmox_node:      ${{ secrets.PROXMOX_NODE }}
  TF_VAR_vm_ssh_keys:       ${{ secrets.TF_VAR_vm_ssh_keys }}

permissions:
  contents: read

jobs:
  apply:
    runs-on: self-hosted
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: [homelab]

    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: tofu init
        run: tofu init

      - name: tofu validate
        run: tofu validate

      - name: tofu apply
        run: tofu apply -auto-approve -no-color
