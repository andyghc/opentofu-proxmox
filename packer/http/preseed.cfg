# Debian automated install preseed for Proxmox template
# This file configures the Debian Installer to run unattended.
# User "andy" will have SSH keys injected via cloud-init at clone time.
# The password set here is a temporary build password only.

### Localisation
d-i debian-installer/locale string en_US.UTF-8
d-i console-setup/ask_detect boolean false
d-i console-setup/layoutcode string us
d-i keyboard-configuration/xkb-keymap select us

### Network (DHCP — Packer will auto-discover the VM's IP)
d-i netcfg/choose_interface select auto
d-i netcfg/dhcp_timeout string 90
d-i netcfg/get_hostname string debian-template
d-i netcfg/get_domain string local

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Clock & Timezone
d-i time/zone string Australia/Brisbane
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Partitioning — single partition, whole disk, no LVM
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### User account
# Temporary build password — cloud-init will inject real SSH keys at clone time
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Andy
d-i passwd/username string andy
d-i passwd/user-password password debian
d-i passwd/user-password-again password debian
d-i user-setup/allow-password-weak boolean true
d-i passwd/user-default-groups string sudo

### Package selection
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server cloud-init qemu-guest-agent sudo ca-certificates curl
d-i pkgsel/install-language-support boolean false
d-i pkgsel/update-policy select none

### GRUB bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_boolean false
d-i grub-installer/bootdev string default

### Final steps — no more prompts
d-i finish-install/reboot_in_progress note
